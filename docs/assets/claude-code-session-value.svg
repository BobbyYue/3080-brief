<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="942" viewBox="0 0 1600 942">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 4 L0 8 z"/></marker></defs>
<rect x="0" y="0" width="1600" height="942" fill="#F5F1EE"/>
<text x="70" y="72" font-size="38" font-weight="800" fill="#1E2421" text-anchor="start">Manage a Claude Code session as a context budget</text>
<text x="70" y="112" font-size="19" font-weight="500" fill="#1E2421" text-anchor="start">Follow the five session habits, then check the four cost drivers in the author&#x27;s rough priority order.</text>
<rect x="60" y="129" width="1480" height="270" rx="8" fill="#FBF9F7"/>
<text x="95" y="165" font-size="24" font-weight="700" fill="#1E2421" text-anchor="start">Five habits keep tokens focused on the current task</text>
<circle cx="236.0" cy="270" r="25" fill="#1456F0"/>
<text x="236.0" y="277" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="236.0" y="332" font-size="16" font-weight="700" fill="#1E2421" text-anchor="middle">Set model + effort</text>
<line x1="266.0" y1="270" x2="488.0" y2="270" stroke="#1456F0" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="518.0" cy="270" r="25" fill="#1456F0"/>
<text x="518.0" y="277" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518.0" y="332" font-size="16" font-weight="700" fill="#1E2421" text-anchor="middle">Inspect /context</text>
<line x1="548.0" y1="270" x2="770.0" y2="270" stroke="#1456F0" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="800.0" cy="270" r="25" fill="#1456F0"/>
<text x="800.0" y="277" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="800.0" y="332" font-size="16" font-weight="700" fill="#1E2421" text-anchor="middle">Attach only what&#x27;s needed</text>
<line x1="830.0" y1="270" x2="1052.0" y2="270" stroke="#1456F0" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1082.0" cy="270" r="25" fill="#1456F0"/>
<text x="1082.0" y="277" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1082.0" y="332" font-size="16" font-weight="700" fill="#1E2421" text-anchor="middle">Offload noisy work</text>
<line x1="1112.0" y1="270" x2="1334.0" y2="270" stroke="#1456F0" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1364.0" cy="270" r="25" fill="#1456F0"/>
<text x="1364.0" y="277" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1364.0" y="332" font-size="16" font-weight="700" fill="#1E2421" text-anchor="middle">Clear or compact</text>
<rect x="60" y="427" width="1480" height="270" rx="8" fill="#EFF0F1" stroke="#B9C9C2"/>
<text x="95" y="463" font-size="24" font-weight="700" fill="#1E2421" text-anchor="start">Where to look first when a session becomes expensive</text>
<text x="95" y="526" font-size="17" font-weight="600" fill="#1E2421" text-anchor="start">Long sessions</text>
<rect x="245" y="508" width="1190.0" height="22" rx="3" fill="#DE7802"/>
<text x="1445.0" y="526" font-size="17" font-weight="700" fill="#DE7802" text-anchor="start">1st</text>
<text x="95" y="558" font-size="17" font-weight="600" fill="#1E2421" text-anchor="start">Excess context</text>
<rect x="245" y="540" width="892.5" height="22" rx="3" fill="#DE7802"/>
<text x="1147.5" y="558" font-size="17" font-weight="700" fill="#DE7802" text-anchor="start">2nd</text>
<text x="95" y="590" font-size="17" font-weight="600" fill="#1E2421" text-anchor="start">Oversized model</text>
<rect x="245" y="572" width="595.0" height="22" rx="3" fill="#DE7802"/>
<text x="850.0" y="590" font-size="17" font-weight="700" fill="#DE7802" text-anchor="start">3rd</text>
<text x="95" y="622" font-size="17" font-weight="600" fill="#1E2421" text-anchor="start">Cache break</text>
<rect x="245" y="604" width="297.5" height="22" rx="3" fill="#DE7802"/>
<text x="552.5" y="622" font-size="17" font-weight="700" fill="#DE7802" text-anchor="start">4th</text>
</svg>
