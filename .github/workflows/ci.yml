name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-validation:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline skill validation and evals
        run: bash skills/3080-brief/scripts/self_test.sh
      - name: Run public resumable runtime smoke test
        run: python skills/3080-brief/scripts/test_public_runtime.py
      - name: Keep the English README English
        run: python -c 'from pathlib import Path; import re; text = Path("README.md").read_text(encoding="utf-8"); assert not re.search(r"[\u3400-\u9fff]", text), "README.md contains Chinese characters"'
      - name: Reject local state and common secret patterns
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(\.sync-state|__pycache__)/|\.pyc$' || true)"
          ! grep -RInE '/Users/[^/]+|app_secret|client_secret|Authorization:[[:space:]]*Bearer' \
            --exclude-dir=.git --exclude='*.md' skills/3080-brief
